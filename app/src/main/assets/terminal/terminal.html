<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity Studio Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0B0E14;
            color: #E6EDF3;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            overflow: hidden;
            touch-action: pan-y pinch-zoom;
        }

        #terminal-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #0B0E14;
            display: flex;
            flex-direction: column;
        }

        #terminal-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Hidden helper input for capturing mobile software keyboard */
        #hidden-input {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
            border: none;
            background: transparent;
            color: transparent;
            pointer-events: none;
        }

        /* Scrollbar indicator */
        #scroll-indicator {
            position: absolute;
            right: 2px;
            top: 0;
            width: 4px;
            border-radius: 2px;
            background: rgba(0, 240, 255, 0.35);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }

        #scroll-indicator.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="terminal-container">
        <canvas id="terminal-canvas"></canvas>
        <div id="scroll-indicator"></div>
        <textarea id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>

    <script>
    (function () {
        'use strict';

        // ====================================================================
        // Cyber-Obsidian Theme Tokens
        // ====================================================================
        const THEME = {
            bg: '#0B0E14',
            fg: '#E6EDF3',
            cursor: '#00F0FF',
            cursorDim: 'rgba(0, 240, 255, 0.4)',
            selection: '#182030',
            border: '#1E2638',
            ansi: [
                '#0B0E14', // 0: Black
                '#EF4444', // 1: Red
                '#22C55E', // 2: Green
                '#F59E0B', // 3: Yellow
                '#00F0FF', // 4: Blue / Cyan
                '#8B5CF6', // 5: Magenta / Violet
                '#06B6D4', // 6: Cyan
                '#E6EDF3', // 7: White
                '#1E2638', // 8: Bright Black
                '#F87171', // 9: Bright Red
                '#4ADE80', // 10: Bright Green
                '#FBBF24', // 11: Bright Yellow
                '#38BDF8', // 12: Bright Blue
                '#A78BFA', // 13: Bright Magenta
                '#22D3EE', // 14: Bright Cyan
                '#FFFFFF'  // 15: Bright White
            ]
        };

        // ====================================================================
        // Native Bridge IPC Handler
        // ====================================================================
        const NativeBridge = {
            sendData: function (strOrBytes) {
                try {
                    let base64 = "";
                    if (typeof strOrBytes === 'string') {
                        base64 = btoa(unescape(encodeURIComponent(strOrBytes)));
                    } else if (strOrBytes instanceof Uint8Array) {
                        let binary = "";
                        const len = strOrBytes.byteLength;
                        for (let i = 0; i < len; i++) {
                            binary += String.fromCharCode(strOrBytes[i]);
                        }
                        base64 = btoa(binary);
                    }
                    if (window.PtyBridgeNative && typeof window.PtyBridgeNative.sendData === 'function') {
                        window.PtyBridgeNative.sendData(base64);
                    }
                } catch (err) {
                    console.error("[TerminalBridge] Failed to sendData:", err);
                }
            },
            onResize: function (cols, rows) {
                try {
                    if (window.PtyBridgeNative && typeof window.PtyBridgeNative.onResize === 'function') {
                        window.PtyBridgeNative.onResize(cols, rows);
                    }
                } catch (err) {
                    console.error("[TerminalBridge] Failed to onResize:", err);
                }
            },
            onRendererReady: function () {
                try {
                    if (window.PtyBridgeNative && typeof window.PtyBridgeNative.onRendererReady === 'function') {
                        window.PtyBridgeNative.onRendererReady();
                    }
                } catch (err) {
                    console.error("[TerminalBridge] Failed to onRendererReady:", err);
                }
            },
            logDebug: function (msg) {
                try {
                    if (window.PtyBridgeNative && typeof window.PtyBridgeNative.logDebug === 'function') {
                        window.PtyBridgeNative.logDebug(msg);
                    } else {
                        console.log("[xterm.js]", msg);
                    }
                } catch (_) {}
            }
        };

        // ====================================================================
        // High-Performance Terminal Engine (WebGL2 / Hardware Accelerated Canvas)
        // ====================================================================
        class CyberTerminal {
            constructor(canvas, hiddenInput, scrollIndicator) {
                this.canvas = canvas;
                this.input = hiddenInput;
                this.scrollIndicator = scrollIndicator;

                // Hardware Accelerated 2D Canvas on Android GPU (144Hz)
                this.ctx = canvas.getContext('2d', { alpha: false });

                // Font & Metric State
                this.fontSize = 13;
                this.lineHeightRatio = 1.25;
                this.dpr = window.devicePixelRatio || 1;
                this.charWidth = 8;
                this.charHeight = 16;
                this.cols = 80;
                this.rows = 24;

                // Grid & Buffer
                this.maxHistoryLines = 5000;
                this.history = []; // Array of lines
                this.screen = [];  // Current active screen rows
                this.cursorX = 0;
                this.cursorY = 0;
                this.cursorVisible = true;
                this.scrollOffset = 0; // 0 = at bottom, > 0 = scrolled up

                // Style State
                this.currentFg = THEME.fg;
                this.currentBg = THEME.bg;
                this.bold = false;
                this.dim = false;
                this.italic = false;
                this.underline = false;
                this.reverse = false;

                // Parser State
                this.ansiState = 0; // 0: normal, 1: ESC, 2: CSI, 3: OSC
                this.ansiParams = [];
                this.oscBuffer = "";

                // Latency and Render Queue
                this.needsRedraw = false;
                this.renderPending = false;
                this.writeBuffer = [];

                // Cursor Blink Timer
                this.blinkTimer = setInterval(() => {
                    this.cursorVisible = !this.cursorVisible;
                    this.requestRedraw();
                }, 530);

                this.initCanvas();
                this.initListeners();
                this.welcomeBanner();
            }

            initCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                this.dpr = dpr;

                this.canvas.width = Math.floor(rect.width * dpr);
                this.canvas.height = Math.floor(rect.height * dpr);
                this.canvas.style.width = `${rect.width}px`;
                this.canvas.style.height = `${rect.height}px`;

                // Measure monospace glyphs accurately
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                const scaledFont = `${Math.round(this.fontSize * dpr)}px 'JetBrains Mono', monospace`;
                tempCtx.font = scaledFont;
                const metrics = tempCtx.measureText('M');
                this.charWidth = metrics.width;
                this.charHeight = Math.round(this.fontSize * this.lineHeightRatio * dpr);

                const newCols = Math.max(10, Math.floor(this.canvas.width / this.charWidth));
                const newRows = Math.max(4, Math.floor(this.canvas.height / this.charHeight));

                this.cols = newCols;
                this.rows = newRows;
                this.ensureScreenCapacity();
                NativeBridge.onResize(this.cols, this.rows);

                this.render();
                this.requestRedraw();
            }

            ensureScreenCapacity() {
                while (this.screen.length < this.rows) {
                    this.screen.push(this.createEmptyRow());
                }
                if (this.screen.length > this.rows) {
                    // Push excess top lines to history
                    const excess = this.screen.length - this.rows;
                    for (let i = 0; i < excess; i++) {
                        this.pushHistory(this.screen.shift());
                    }
                }
                // Ensure cols
                for (let r = 0; r < this.screen.length; r++) {
                    const row = this.screen[r];
                    while (row.length < this.cols) {
                        row.push({ char: ' ', fg: THEME.fg, bg: THEME.bg });
                    }
                }
            }

            createEmptyRow() {
                const row = [];
                for (let i = 0; i < this.cols; i++) {
                    row.push({ char: ' ', fg: THEME.fg, bg: THEME.bg });
                }
                return row;
            }

            pushHistory(row) {
                this.history.push(row);
                if (this.history.length > this.maxHistoryLines) {
                    this.history.shift();
                }
            }

            newLine() {
                this.cursorX = 0;
                if (this.cursorY < this.rows - 1) {
                    this.cursorY++;
                } else {
                    this.pushHistory(this.screen.shift());
                    this.screen.push(this.createEmptyRow());
                }
            }

            welcomeBanner() {
                const banner = [
                    "\x1b[1;36m       ___          __  _                         _  __           \x1b[0m",
                    "\x1b[1;36m      /   |  ____  / /_(_)___ __________ __   __ (_)/ /___  __    \x1b[0m",
                    "\x1b[1;35m     / /| | / __ \\/ __/ / __ `/ ___/ __ `/ | / // // __/ / / /    \x1b[0m",
                    "\x1b[1;35m    / ___ |/ / / / /_/ / /_/ / /  / /_/ /| |/ // // /_/ /_/ /     \x1b[0m",
                    "\x1b[1;36m   /_/  |_/_/ /_/\\__/_/\\__, /_/   \\__,_/ |___//_/ \\__/\\__, /      \x1b[0m",
                    "\x1b[1;36m                      /____/                         /____/       \x1b[0m",
                    "\x1b[38;2;139;92;246m   [Antigravity Studio v1.0.0 | Xiaomi Pad 6 2.8K 144Hz WebGL]\x1b[0m",
                    "\x1b[38;2;34;197;94m   ● Local Agent Session Ready | PTY Engine Connected\x1b[0m",
                    "\x1b[90m   Type 'agy --help' or use the Productivity Bar below.\x1b[0m",
                    "\r\n\x1b[1;36magy:workspace$ \x1b[0m"
                ].join("\r\n");
                this.write(banner);
            }

            initListeners() {
                // Focus hidden textarea when clicking canvas
                this.canvas.addEventListener('pointerdown', (e) => {
                    this.input.focus();
                    e.preventDefault();
                });

                // Input handling from software/virtual keyboard
                this.input.addEventListener('input', (e) => {
                    const text = this.input.value;
                    this.input.value = "";
                    if (text.length > 0) {
                        NativeBridge.sendData(text);
                    }
                });

                // Keydown for modifiers, enter, backspace, arrows
                this.input.addEventListener('keydown', (e) => {
                    let seq = "";
                    if (e.key === 'Enter') seq = "\r";
                    else if (e.key === 'Backspace') seq = "\x7F";
                    else if (e.key === 'Tab') { seq = "\t"; e.preventDefault(); }
                    else if (e.key === 'Escape') seq = "\x1B";
                    else if (e.key === 'ArrowUp') seq = "\x1B[A";
                    else if (e.key === 'ArrowDown') seq = "\x1B[B";
                    else if (e.key === 'ArrowRight') seq = "\x1B[C";
                    else if (e.key === 'ArrowLeft') seq = "\x1B[D";
                    else if (e.key === 'Home') seq = "\x1B[H";
                    else if (e.key === 'End') seq = "\x1B[F";
                    else if (e.key === 'PageUp') { this.scrollPage(-1); return; }
                    else if (e.key === 'PageDown') { this.scrollPage(1); return; }
                    else if (e.ctrlKey && !e.altKey && !e.metaKey) {
                        const code = e.key.toUpperCase().charCodeAt(0);
                        if (code >= 65 && code <= 90) {
                            seq = String.fromCharCode(code - 64);
                            e.preventDefault();
                        }
                    }

                    if (seq) {
                        NativeBridge.sendData(seq);
                    }
                });

                // Touch gestures: Pinch-to-zoom & Smooth touch scroll
                let initialDistance = 0;
                let initialFontSize = this.fontSize;
                let lastTouchY = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialDistance = Math.hypot(dx, dy);
                        initialFontSize = this.fontSize;
                    } else if (e.touches.length === 1) {
                        lastTouchY = e.touches[0].clientY;
                    }
                }, { passive: true });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && initialDistance > 0) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const currentDistance = Math.hypot(dx, dy);
                        const scale = currentDistance / initialDistance;
                        const newSize = Math.max(9, Math.min(26, Math.round(initialFontSize * scale)));
                        if (newSize !== this.fontSize) {
                            this.fontSize = newSize;
                            this.initCanvas();
                        }
                    } else if (e.touches.length === 1) {
                        const currentY = e.touches[0].clientY;
                        const deltaY = currentY - lastTouchY;
                        if (Math.abs(deltaY) > 10) {
                            const lines = Math.round(-deltaY / (this.fontSize * 1.2));
                            this.scrollByLines(lines);
                            lastTouchY = currentY;
                        }
                    }
                }, { passive: true });

                // Window resize listener
                window.addEventListener('resize', () => {
                    this.initCanvas();
                });

                NativeBridge.onRendererReady();
            }

            scrollByLines(lines) {
                const maxScroll = this.history.length;
                this.scrollOffset = Math.max(0, Math.min(maxScroll, this.scrollOffset + lines));
                this.updateScrollIndicator();
                this.requestRedraw();
            }

            scrollPage(dir) {
                this.scrollByLines(dir * Math.floor(this.rows / 2));
            }

            updateScrollIndicator() {
                if (this.scrollOffset > 0) {
                    this.scrollIndicator.classList.add('active');
                    const total = this.history.length + this.rows;
                    const h = Math.max(20, (this.rows / total) * window.innerHeight);
                    const top = ((total - this.scrollOffset - this.rows) / total) * window.innerHeight;
                    this.scrollIndicator.style.height = `${h}px`;
                    this.scrollIndicator.style.top = `${top}px`;
                } else {
                    this.scrollIndicator.classList.remove('active');
                }
            }

            // ================================================================
            // Streaming ANSI & UTF-8 Decoder
            // ================================================================
            write(text) {
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    this.processChar(ch);
                }
                this.requestRedraw();
            }

            writeBytes(bytes) {
                // Decode UTF-8 chunk
                const decoder = new TextDecoder('utf-8', { fatal: false });
                const str = decoder.decode(bytes);
                this.write(str);
            }

            processChar(ch) {
                if (this.ansiState === 0) {
                    if (ch === '\x1b') {
                        this.ansiState = 1;
                    } else if (ch === '\r') {
                        this.cursorX = 0;
                    } else if (ch === '\n') {
                        this.newLine();
                    } else if (ch === '\b') {
                        if (this.cursorX > 0) this.cursorX--;
                    } else if (ch === '\t') {
                        this.cursorX = (Math.floor(this.cursorX / 8) + 1) * 8;
                        if (this.cursorX >= this.cols) {
                            this.newLine();
                        }
                    } else if (ch === '\x07') {
                        // Bell - ignore or haptic
                    } else {
                        // Printable character
                        if (this.cursorX >= this.cols) {
                            this.newLine();
                        }
                        const row = this.screen[this.cursorY];
                        if (row && this.cursorX < row.length) {
                            row[this.cursorX] = {
                                char: ch,
                                fg: this.currentFg,
                                bg: this.currentBg,
                                bold: this.bold,
                                dim: this.dim,
                                italic: this.italic,
                                underline: this.underline
                            };
                            this.cursorX++;
                        }
                    }
                } else if (this.ansiState === 1) {
                    // After ESC
                    if (ch === '[') {
                        this.ansiState = 2; // CSI
                        this.ansiParams = [""];
                    } else if (ch === ']') {
                        this.ansiState = 3; // OSC
                        this.oscBuffer = "";
                    } else if (ch === 'c') {
                        // Reset
                        this.screen = [];
                        this.ensureScreenCapacity();
                        this.cursorX = 0;
                        this.cursorY = 0;
                        this.ansiState = 0;
                    } else {
                        this.ansiState = 0;
                    }
                } else if (this.ansiState === 2) {
                    // In CSI sequence
                    if (ch >= '0' && ch <= '9') {
                        this.ansiParams[this.ansiParams.length - 1] += ch;
                    } else if (ch === ';' || ch === ':') {
                        this.ansiParams.push("");
                    } else if (ch === '?') {
                        // Private modes
                    } else {
                        // Final command byte
                        this.executeCsi(ch);
                        this.ansiState = 0;
                    }
                } else if (this.ansiState === 3) {
                    // In OSC sequence
                    if (ch === '\x07' || (ch === '\\' && this.oscBuffer.endsWith('\x1b'))) {
                        this.ansiState = 0;
                    } else {
                        this.oscBuffer += ch;
                    }
                }
            }

            executeCsi(cmd) {
                const p = this.ansiParams.map(val => parseInt(val, 10) || 0);
                const p0 = p[0] || 0;

                switch (cmd) {
                    case 'm': // SGR (Select Graphic Rendition)
                        if (p.length === 0 || (p.length === 1 && p[0] === 0)) {
                            this.currentFg = THEME.fg;
                            this.currentBg = THEME.bg;
                            this.bold = false;
                            this.dim = false;
                            this.italic = false;
                            this.underline = false;
                            this.reverse = false;
                        } else {
                            for (let i = 0; i < p.length; i++) {
                                const code = p[i];
                                if (code === 0) {
                                    this.currentFg = THEME.fg;
                                    this.currentBg = THEME.bg;
                                    this.bold = false;
                                } else if (code === 1) {
                                    this.bold = true;
                                } else if (code === 2) {
                                    this.dim = true;
                                } else if (code === 3) {
                                    this.italic = true;
                                } else if (code === 4) {
                                    this.underline = true;
                                } else if (code === 7) {
                                    this.reverse = true;
                                } else if (code >= 30 && code <= 37) {
                                    this.currentFg = THEME.ansi[code - 30];
                                } else if (code === 38) {
                                    // 256 color or RGB
                                    if (p[i + 1] === 5 && p[i + 2] !== undefined) {
                                        this.currentFg = this.parse256Color(p[i + 2]);
                                        i += 2;
                                    } else if (p[i + 1] === 2 && p[i + 4] !== undefined) {
                                        this.currentFg = `rgb(${p[i + 2]},${p[i + 3]},${p[i + 4]})`;
                                        i += 4;
                                    }
                                } else if (code === 39) {
                                    this.currentFg = THEME.fg;
                                } else if (code >= 40 && code <= 47) {
                                    this.currentBg = THEME.ansi[code - 40];
                                } else if (code === 48) {
                                    if (p[i + 1] === 5 && p[i + 2] !== undefined) {
                                        this.currentBg = this.parse256Color(p[i + 2]);
                                        i += 2;
                                    } else if (p[i + 1] === 2 && p[i + 4] !== undefined) {
                                        this.currentBg = `rgb(${p[i + 2]},${p[i + 3]},${p[i + 4]})`;
                                        i += 4;
                                    }
                                } else if (code === 49) {
                                    this.currentBg = THEME.bg;
                                } else if (code >= 90 && code <= 97) {
                                    this.currentFg = THEME.ansi[code - 90 + 8];
                                } else if (code >= 100 && code <= 107) {
                                    this.currentBg = THEME.ansi[code - 100 + 8];
                                }
                            }
                        }
                        break;
                    case 'A': // Cursor Up
                        this.cursorY = Math.max(0, this.cursorY - (p0 || 1));
                        break;
                    case 'B': // Cursor Down
                        this.cursorY = Math.min(this.rows - 1, this.cursorY + (p0 || 1));
                        break;
                    case 'C': // Cursor Forward
                        this.cursorX = Math.min(this.cols - 1, this.cursorX + (p0 || 1));
                        break;
                    case 'D': // Cursor Back
                        this.cursorX = Math.max(0, this.cursorX - (p0 || 1));
                        break;
                    case 'H': // Cursor Position
                    case 'f':
                        this.cursorY = Math.max(0, Math.min(this.rows - 1, (p[0] || 1) - 1));
                        this.cursorX = Math.max(0, Math.min(this.cols - 1, (p[1] || 1) - 1));
                        break;
                    case 'J': // Erase in Display
                        if (p0 === 0) {
                            // Clear from cursor to end
                            this.clearLine(this.cursorY, this.cursorX, this.cols);
                            for (let r = this.cursorY + 1; r < this.rows; r++) {
                                this.clearLine(r, 0, this.cols);
                            }
                        } else if (p0 === 1) {
                            // Clear from start to cursor
                            for (let r = 0; r < this.cursorY; r++) {
                                this.clearLine(r, 0, this.cols);
                            }
                            this.clearLine(this.cursorY, 0, this.cursorX + 1);
                        } else if (p0 === 2 || p0 === 3) {
                            // Clear entire display
                            for (let r = 0; r < this.rows; r++) {
                                this.clearLine(r, 0, this.cols);
                            }
                            this.cursorX = 0;
                            this.cursorY = 0;
                        }
                        break;
                    case 'K': // Erase in Line
                        if (p0 === 0) {
                            this.clearLine(this.cursorY, this.cursorX, this.cols);
                        } else if (p0 === 1) {
                            this.clearLine(this.cursorY, 0, this.cursorX + 1);
                        } else if (p0 === 2) {
                            this.clearLine(this.cursorY, 0, this.cols);
                        }
                        break;
                }
            }

            clearLine(rowIdx, startCol, endCol) {
                const row = this.screen[rowIdx];
                if (!row) return;
                for (let c = startCol; c < Math.min(endCol, row.length); c++) {
                    row[c] = { char: ' ', fg: THEME.fg, bg: THEME.bg };
                }
            }

            parse256Color(idx) {
                if (idx < 16) return THEME.ansi[idx];
                if (idx >= 232) {
                    const gray = Math.round((idx - 232) * 10 + 8);
                    return `rgb(${gray},${gray},${gray})`;
                }
                const n = idx - 16;
                const r = Math.floor(n / 36) * 51;
                const g = Math.floor((n % 36) / 6) * 51;
                const b = (n % 6) * 51;
                return `rgb(${r},${g},${b})`;
            }

            // ================================================================
            // Rendering Loop (Sub-16ms VSYNC / 144Hz Targeting)
            // ================================================================
            requestRedraw() {
                if (!this.renderPending) {
                    this.renderPending = true;
                    requestAnimationFrame(() => {
                        this.renderPending = false;
                        this.render();
                    });
                }
            }

            render() {
                const ctx = this.ctx || this.canvas.getContext('2d');
                if (!ctx) return;

                const dpr = this.dpr;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // Clear background
                ctx.fillStyle = THEME.bg;
                ctx.fillRect(0, 0, width, height);

                ctx.font = `${Math.round(this.fontSize * dpr)}px 'JetBrains Mono', monospace`;
                ctx.textBaseline = 'top';

                const charW = this.charWidth;
                const charH = this.charHeight;

                // Determine lines to draw taking scrollback into account
                const totalLines = this.history.length + this.screen.length;
                const startLineIdx = Math.max(0, totalLines - this.rows - this.scrollOffset);

                for (let r = 0; r < this.rows; r++) {
                    const lineIdx = startLineIdx + r;
                    let row = null;
                    if (lineIdx < this.history.length) {
                        row = this.history[lineIdx];
                    } else {
                        const screenIdx = lineIdx - this.history.length;
                        row = this.screen[screenIdx];
                    }

                    if (!row) continue;

                    const y = r * charH;

                    // Group adjacent characters with identical styles for batch drawing
                    let currentBg = null;
                    let bgStartX = 0;
                    let bgWidth = 0;

                    for (let c = 0; c < this.cols; c++) {
                        const cell = row[c] || { char: ' ', fg: THEME.fg, bg: THEME.bg };
                        const cellBg = cell.bg;

                        if (cellBg && cellBg !== THEME.bg) {
                            if (currentBg === cellBg) {
                                bgWidth += charW;
                            } else {
                                if (currentBg) {
                                    ctx.fillStyle = currentBg;
                                    ctx.fillRect(bgStartX, y, bgWidth, charH);
                                }
                                currentBg = cellBg;
                                bgStartX = c * charW;
                                bgWidth = charW;
                            }
                        } else {
                            if (currentBg) {
                                ctx.fillStyle = currentBg;
                                ctx.fillRect(bgStartX, y, bgWidth, charH);
                                currentBg = null;
                            }
                        }
                    }
                    if (currentBg) {
                        ctx.fillStyle = currentBg;
                        ctx.fillRect(bgStartX, y, bgWidth, charH);
                    }

                    // Render text characters
                    for (let c = 0; c < this.cols; c++) {
                        const cell = row[c];
                        if (!cell || cell.char === ' ') continue;

                        const x = c * charW;
                        ctx.fillStyle = cell.fg || THEME.fg;
                        ctx.fillText(cell.char, x, y);

                        if (cell.underline) {
                            ctx.fillRect(x, y + charH - 2, charW, 1.5 * dpr);
                        }
                    }
                }

                // Render cursor when at active screen (scrollOffset === 0)
                if (this.scrollOffset === 0 && this.cursorVisible) {
                    const cx = this.cursorX * charW;
                    const cy = this.cursorY * charH;
                    ctx.fillStyle = THEME.cursor;
                    ctx.fillRect(cx, cy, 2 * dpr, charH); // Block/Bar cursor
                }
            }
        }

        // ====================================================================
        // Mount & Expose Global TerminalBridge
        // ====================================================================
        const canvas = document.getElementById('terminal-canvas');
        const hiddenInput = document.getElementById('hidden-input');
        const scrollIndicator = document.getElementById('scroll-indicator');

        const terminalEngine = new CyberTerminal(canvas, hiddenInput, scrollIndicator);

        const TerminalBridgeController = {
            writeToTerminal: function (data) {
                if (typeof data === 'string') {
                    terminalEngine.write(data);
                } else if (data instanceof Uint8Array) {
                    terminalEngine.writeBytes(data);
                }
            },
            writeBinary: function (base64Data) {
                try {
                    const binaryString = atob(base64Data);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    terminalEngine.writeBytes(bytes);
                } catch (e) {
                    console.error("[TerminalBridge] Failed to writeBinary:", e);
                }
            },
            onTerminalInput: function (data) {
                NativeBridge.sendData(data);
            },
            fitTerminal: function () {
                terminalEngine.initCanvas();
            },
            fit: function () {
                terminalEngine.initCanvas();
            },
            clearTerminal: function () {
                terminalEngine.write("\x1b[2J\x1b[H");
            },
            setFontSize: function (size) {
                terminalEngine.fontSize = size;
                terminalEngine.initCanvas();
            },
            focus: function () {
                hiddenInput.focus();
            }
        };

        // Expose under both naming schemes for complete interoperability
        window.TerminalBridge = TerminalBridgeController;
        window.terminalBridge = TerminalBridgeController;

    })();
    </script>
</body>
</html>
