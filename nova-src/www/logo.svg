<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Prisma Bloom Filter -->
    <filter id="prismBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle radial glow for central convergence -->
    <radialGradient id="prismGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#34a853" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Void Background (Dark Void Theme) -->
  <rect width="512" height="512" fill="#090d16" rx="96" />

  <!-- Sutil resplandor de convergencia gravitacional -->
  <circle cx="256" cy="256" r="160" fill="url(#prismGlow)" filter="url(#prismBloom)" />

  <!-- Prisma Gravitacional de Google - 4 Colores Canónicos -->
  <!-- Faceta Superior (Google Red: #ea4335 - Alertas, Detencion, Refinamiento) -->
  <path d="M 256,92 L 354,236 L 256,212 L 158,236 Z" 
        fill="#ea4335" 
        filter="url(#prismBloom)" />

  <!-- Faceta Izquierda (Google Blue: #4285f4 - Estructura, Logica, Herramientas) -->
  <path d="M 158,236 L 256,212 L 256,348 L 138,368 Z" 
        fill="#4285f4" 
        filter="url(#prismBloom)" />

  <!-- Faceta Derecha (Google Yellow: #fbbc04 - Razonamiento, Thinking, Advertencias) -->
  <path d="M 354,236 L 256,212 L 256,348 L 374,368 Z" 
        fill="#fbbc04" 
        filter="url(#prismBloom)" />

  <!-- Faceta Base (Google Green: #34a853 - Aprobacion de Plan, Diffs Positivos, Tests OK) -->
  <path d="M 138,368 L 256,348 L 374,368 L 256,424 Z" 
        fill="#34a853" 
        filter="url(#prismBloom)" />

  <!-- Nucleo de Refraccion Central (Estrella Gravitacional ✦) -->
  <circle cx="256" cy="276" r="16" fill="#ffffff" opacity="0.95" />
  <path d="M 256 244 
           Q 256 276 224 276 
           Q 256 276 256 308 
           Q 256 276 288 276 
           Q 256 276 256 244 Z" 
        fill="#ffffff" />
</svg>
